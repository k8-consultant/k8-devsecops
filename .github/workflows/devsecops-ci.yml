name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Multi-platform Docker Build, Scan and Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 image for security scanning
        run: |
          docker buildx build --pull \
            --platform linux/amd64 \
            --load \
            -t devsecops-api:amd64-scan .

      - name: Scan AMD64 image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devsecops-api:amd64-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build ARM64 image for security scanning
        run: |
          docker buildx build --pull \
            --platform linux/arm64 \
            --load \
            -t devsecops-api:arm64-scan .

      - name: Scan ARM64 image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devsecops-api:arm64-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: false
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/devsecops-api:${{ github.sha }}

  update-gitops:
    name: Update GitOps Image Tag
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: k8-consultant/k8-devsecops-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("gitops/environments/dev/values.yaml")
          lines = path.read_text().splitlines(keepends=True)

          for index, line in enumerate(lines):
              if line.startswith("  tag:"):
                  lines[index] = f'  tag: "{os.environ["IMAGE_TAG"]}"\n'
                  break
          else:
              raise SystemExit("Image tag not found")

          path.write_text("".join(lines))
          PY

      - name: Commit and push GitOps update
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/values.yaml

          if git diff --cached --quiet; then
            echo "Image tag already up to date"
            exit 0
          fi

          git commit -m "ci: update devsecops-api image to ${{ github.sha }}"
          git push origin HEAD:main
